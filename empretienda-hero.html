<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400;1,500&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap');

.bsh {
  position: relative;
  width: 100%;
  height: 90vh;
  min-height: 560px;
  background: #3A3835;
  overflow: hidden;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.bsh * { box-sizing: border-box; margin: 0; padding: 0; }

/* video de fondo */
.bsh__video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  z-index: 0;
}

/* velo encima del video */
.bsh::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: rgba(58,56,53,0.58);
}

/* contenido central */
.bsh__content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 0 24px;
}

/* BRUTA wordmark */
.bsh__wordmark {
  font-family: "Playfair Display", Georgia, serif !important;
  font-weight: 600 !important;
  font-style: normal !important;
  font-size: clamp(72px, 14vw, 200px) !important;
  line-height: 0.88 !important;
  letter-spacing: -0.02em !important;
  color: #E8E4DE !important;
  text-shadow: 0 4px 40px rgba(0,0,0,0.4) !important;
  display: block !important;
}

/* eyebrow */
.bsh__eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: #D4CEBE;
  margin-top: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  opacity: 0.85;
}
.bsh__eyebrow::before,
.bsh__eyebrow::after {
  content: "";
  width: 28px;
  height: 1px;
  background: #D4CEBE;
  opacity: 0.5;
  flex-shrink: 0;
}

/* subtitulo materiales */
.bsh__subtitle {
  font-family: "Inter", system-ui, sans-serif;
  font-weight: 300;
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(212,206,190,0.7);
  margin-top: 20px;
}
.bsh__dot {
  display: inline-block;
  margin: 0 10px;
  color: #C4967E;
}

/* CTA abajo */
.bsh__cta-wrap {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 44px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.bsh__cta {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #7E8E94;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: color 0.3s ease, letter-spacing 0.3s ease;
}
.bsh__cta:hover { color: #E8E4DE; letter-spacing: 0.38em; }
.bsh__arrow { display: inline-block; transition: transform 0.4s ease; }
.bsh__cta:hover .bsh__arrow { transform: translateY(5px); }

/* linea base */
.bsh__rule {
  position: absolute;
  z-index: 2;
  left: 0; right: 0;
  bottom: 108px;
  height: 1px;
  background: linear-gradient(
    to right,
    transparent 0,
    rgba(232,228,222,0.07) 8%,
    rgba(232,228,222,0.16) 50%,
    rgba(232,228,222,0.07) 92%,
    transparent 100%
  );
}

/* esquinas */
.bsh__corner {
  position: absolute;
  z-index: 3;
  bottom: 40px;
  font-family: "JetBrains Mono", monospace;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #7E8E94;
  line-height: 1.7;
}
.bsh__corner--l { left: 48px; }
.bsh__corner--r { right: 48px; text-align: right; }

@media (max-width: 720px) {
  .bsh__corner { bottom: 82px; }
  .bsh__corner--l { left: 22px; }
  .bsh__corner--r { right: 22px; }
  .bsh__cta-wrap { bottom: 24px; }
  .bsh__rule { bottom: 74px; }
}
</style>

<section class="bsh" aria-label="Hero BRUTA">

  <video class="bsh__video" autoplay muted loop playsinline>
    <source src="https://bruta-landing.vercel.app/vidrios-01.mp4" type="video/mp4" />
  </video>

  <div class="bsh__content">
    <h2 class="bsh__wordmark">BRUTA</h2>

    <p class="bsh__eyebrow">Laboratorio de diseño · CBA</p>

    <p class="bsh__subtitle">
      TERRAZO
      <span class="bsh__dot">·</span>
      VIDRIO RECICLADO
      <span class="bsh__dot">·</span>
      HIERRO
    </p>
  </div>

  <div class="bsh__corner bsh__corner--l">
    Córdoba<br/>Argentina
  </div>
  <div class="bsh__corner bsh__corner--r">
    VIDRIO<br/>RECICLADO
  </div>

  <div class="bsh__rule"></div>

  <div class="bsh__cta-wrap">
    <a class="bsh__cta" href="#productos">
      VER PRODUCTOS
      <span class="bsh__arrow">↓</span>
    </a>
  </div>

</section>
